<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Head Gone Wrong by Noise</title>
  <meta name="description" content="Get in touch.">
  <meta property="og:title" content="Contact — Head Gone Wrong by Noise">
  <meta property="og:description" content="Get in touch.">
  <meta property="og:url" content="https://headgonebynoise.com/contact.html">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://headgonebynoise.com/contact.html">
  <link rel="stylesheet" href="styles.css?v=BUILD_SHA">
  <style>
    .contact-page {
      max-width: 480px;
      margin: 0 auto;
      padding: 140px 2rem 80px;
      text-align: center;
    }
    .contact-photo {
      width: 100%;
      max-width: 420px;
      height: auto;
      margin: 0 auto;
      display: block;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
    }
    .contact-photo-btn {
      display: block;
      width: 100%;
      max-width: 420px;
      margin: 0 auto 1.75rem;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    .contact-photo-btn:hover {
      opacity: 0.85;
    }
    .contact-photo-caption {
      display: block;
      margin-top: 0.6rem;
      font-size: 0.85rem;
      color: #1a73e8;
      text-decoration: underline;
    }
    .contact-email {
      font-size: 1.05rem;
      color: #1a1a2e;
      text-decoration: none;
      border-bottom: 1px solid rgba(26, 26, 46, 0.25);
      padding-bottom: 2px;
      transition: opacity 0.15s;
    }
    .contact-email:hover {
      opacity: 0.6;
    }

    /* Résumé modal */
    .resume-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .resume-modal-overlay.open {
      display: flex;
    }
    .resume-modal {
      position: relative;
      background: #fff;
      border-radius: 12px;
      width: min(800px, 100%);
      height: min(900px, 90vh);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .resume-modal-close {
      position: absolute;
      top: 6px;
      right: 10px;
      background: none;
      border: none;
      font-size: 28px;
      line-height: 1;
      color: #666;
      cursor: pointer;
      z-index: 1;
      padding: 6px 10px;
    }
    .resume-modal-close:hover {
      color: #1a1a2e;
    }
    .resume-modal-body {
      flex: 1;
      overflow: auto;
      background: #f0f0f0;
    }
    .resume-modal-body img {
      display: block;
      width: 100%;
      height: auto;
    }
    .resume-modal-fallback {
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      color: #1a73e8;
      text-decoration: none;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
    }
    .resume-modal-fallback:hover {
      text-decoration: underline;
    }
    @media (max-width: 700px) {
      .resume-modal { height: 85vh; }
    }
  </style>
</head>
<body>
  <header></header>
  <script src="header.js?v=BUILD_SHA"></script>

  <div class="contact-page">
    <button type="button" class="contact-photo-btn" id="resume-trigger" aria-haspopup="dialog" aria-controls="resume-modal-overlay">
      <img class="contact-photo" src="images/contact-photo.jpg" alt="Michael Sheppard">
      <span class="contact-photo-caption">View résumé</span>
    </button>
    <a class="contact-email" href="mailto:michaeladamshep@gmail.com">michaeladamshep@gmail.com</a>
  </div>

  <div class="resume-modal-overlay" id="resume-modal-overlay">
    <div class="resume-modal" role="dialog" aria-modal="true" aria-label="Résumé">
      <button type="button" class="resume-modal-close" id="resume-modal-close" aria-label="Close résumé">&times;</button>
      <div class="resume-modal-body">
        <img id="resume-modal-img" src="" alt="Michael Sheppard's résumé" loading="lazy">
      </div>
      <a class="resume-modal-fallback" href="resume.pdf" target="_blank" rel="noopener">Open PDF in new tab ↗</a>
    </div>
  </div>

  <script>
    (function () {
      const trigger = document.getElementById('resume-trigger');
      const overlay = document.getElementById('resume-modal-overlay');
      const img = document.getElementById('resume-modal-img');
      const closeBtn = document.getElementById('resume-modal-close');

      function openModal() {
        img.src = 'images/resume-page1.png';
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function closeModal() {
        overlay.classList.remove('open');
        document.body.style.overflow = '';
        img.src = '';
      }

      trigger.addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
      });
    })();
  </script>
</body>
</html>
