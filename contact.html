<!DOCTYPE html>

  <link rel="stylesheet" href="styles.css">
  <style>
    .contact-page {
      max-width: 480px;
      margin: 0 auto;
      padding: 140px 2rem 80px;
      text-align: center;
    }
    .contact-photo {
      width: 100%;
      max-width: 420px;
      height: auto;
      margin: 0 auto 1.75rem;
      display: block;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
    }
    .contact-name {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 600;
      color: #1a1a2e;
      margin: 0 0 2.5rem;
    }
    .contact-email {
      font-size: 1.05rem;
      color: #1a1a2e;
      text-decoration: none;
      border-bottom: 1px solid rgba(26, 26, 46, 0.25);
      padding-bottom: 2px;
      transition: opacity 0.15s;
    }
    .contact-email:hover {
      opacity: 0.6;
    }
  </style>

  <header></header>
  <script src="header.js"></script>

  <div class="contact-page">
